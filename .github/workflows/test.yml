---
# Tests, and checks that tools/lib is Tessera's own code and every add-on packs under Tessera's rules.
name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Security standards (SECURITY.md)
        run: node tools/security-check.cjs
      - name: Tessera's launcher (for its packing and signature code)
        run: git clone --depth 1 https://github.com/Herbalchemist/tessera /tmp/tessera
      - name: Tests
        run: node --test test/*.test.js
      - name: Checks
        run: node tools/check.cjs /tmp/tessera/system_files/usr/lib/tessera/launcher
